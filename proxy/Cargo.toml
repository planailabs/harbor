[package]
name = "harbor-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
pingora = { version = "0.8", features = ["proxy", "boringssl"] }
plan-ai-html = { path = "../common/plan-ai-html" }
cookie = "0.18"
rcgen = "0.13"
arc-swap = "1"
reqwest = { workspace = true, features = ["stream"] }
rustls = { workspace = true }
eventsource-stream = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# pingora-core 0.8.1 builds BufStream::with_capacity(0, 0, ..) for every
# accepted TCP stream; tokio 1.54 asserts capacity > 0 there and the proxy
# panics at startup. Lift once pingora stops doing that.
tokio = { version = ">=1, <1.54", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
http = "1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["serde"] }
urlencoding = "2"
chrono = "0.4"
bytes = "1"
