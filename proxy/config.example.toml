[proxy]
domain = "harbor.example.com"
# Old hostnames: answered with a 308 to the same path on `domain`.
redirect_domains = ["agency.example.com"]
upstream = "127.0.0.1:7380"
http_addr = "[::]:80"
https_addr = "[::]:443"
# HTTP/3 over QUIC on UDP at https_addr's address and port, advertised with
# Alt-Svc on HTTPS responses. On by default; false serves TCP only.
# WebTransport rides on it too; which hosts offer it (and where their QUIC
# upstream is) comes from the server with the routes (a host's quic_upstream).
quic = true
internal_token_path = "/var/lib/harbor-server/internal.token"
server_url = "http://127.0.0.1:7380"
